<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Mutation concentrated on three map lineages</title><desc>Formal RQ1 compact JSONL. Initial pool means case IDs 0-89 in each job. Selected-parent child tasks have parent_case not null. Source-map lineage is inherited even if map patches change the actual grid.</desc><rect x="0.00" y="0.00" width="1920.00" height="1080.00" fill="#F6F8FB"/><rect x="70.00" y="55.00" width="1780.00" height="960.00" fill="#FFFFFF" rx="24"/><text x="110.00" y="145.00" font-family="Arial,Helvetica,sans-serif" font-size="56" fill="#17223B" font-weight="700" text-anchor="start">Mutation concentrated on three map lineages</text><text x="110.00" y="197.00" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#5C6880" font-weight="400" text-anchor="start">Source maps of the initial pool versus tasks mutated from a selected parent</text><rect x="1560.00" y="95.00" width="230.00" height="45.00" fill="#EAF0F8" rx="20"/><text x="1675.00" y="125.00" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#2D4F78" font-weight="700" text-anchor="middle">RQ1 · MAIN EXPERIMENT</text><rect x="200.00" y="250.00" width="30.00" height="30.00" fill="#3E78A7" rx="4"/><text x="242.00" y="275.00" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#17223B" font-weight="600" text-anchor="start">Denver_0</text><rect x="600.00" y="250.00" width="30.00" height="30.00" fill="#E7A838" rx="4"/><text x="642.00" y="275.00" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#17223B" font-weight="600" text-anchor="start">Paris_2</text><rect x="1005.00" y="250.00" width="30.00" height="30.00" fill="#48A58B" rx="4"/><text x="1047.00" y="275.00" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#17223B" font-weight="600" text-anchor="start">London_2</text><rect x="1405.00" y="250.00" width="30.00" height="30.00" fill="#BCC6D2" rx="4"/><text x="1447.00" y="275.00" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#17223B" font-weight="600" text-anchor="start">Other 27 maps</text><text x="310.00" y="358.00" font-family="Arial,Helvetica,sans-serif" font-size="35" fill="#17223B" font-weight="700" text-anchor="start">Initial pool</text><rect x="310.00" y="390.00" width="41.00" height="110.00" fill="#3E78A7"/><rect x="351.00" y="390.00" width="41.00" height="110.00" fill="#E7A838"/><rect x="392.00" y="390.00" width="41.00" height="110.00" fill="#48A58B"/><rect x="433.00" y="390.00" width="1107.00" height="110.00" fill="#BCC6D2"/><text x="986.50" y="457.00" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#17223B" font-weight="700" text-anchor="middle">90.0%</text><text x="1585.00" y="456.00" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#5C6880" font-weight="500" text-anchor="start">n = 1,800</text><text x="310.00" y="548.00" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#5C6880" font-weight="400" text-anchor="start">Denver_0_256.map: 60 · Paris_2_256.map: 60 · London_2_256.map: 60</text><text x="310.00" y="618.00" font-family="Arial,Helvetica,sans-serif" font-size="35" fill="#17223B" font-weight="700" text-anchor="start">Selected-parent children</text><rect x="310.00" y="650.00" width="587.09" height="110.00" fill="#3E78A7"/><text x="603.54" y="717.00" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">47.7%</text><rect x="897.09" y="650.00" width="489.56" height="110.00" fill="#E7A838"/><text x="1141.87" y="717.00" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">39.8%</text><rect x="1386.65" y="650.00" width="146.62" height="110.00" fill="#48A58B"/><text x="1459.96" y="717.00" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#FFFFFF" font-weight="700" text-anchor="middle">11.9%</text><rect x="1533.27" y="650.00" width="6.73" height="110.00" fill="#BCC6D2"/><text x="1585.00" y="716.00" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#5C6880" font-weight="500" text-anchor="start">n = 90,843</text><text x="310.00" y="808.00" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#5C6880" font-weight="400" text-anchor="start">Denver_0_256.map: 43,360 · Paris_2_256.map: 36,157 · London_2_256.map: 10,829</text><rect x="110.00" y="888.00" width="1700.00" height="93.00" fill="#EEF4F9" rx="8"/><text x="130.00" y="925.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#24445F" font-weight="600" text-anchor="start">The three named source-map lineages account for 99.5% of selected-parent child tasks.</text><text x="130.00" y="960.00" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#24445F" font-weight="500" text-anchor="start">This is a lineage/exposure pattern, not evidence that only three distinct mutated grids were tested.</text><line x1="110" y1="1005" x2="1810" y2="1005" stroke="#D9E0EA" stroke-width="1"/><text x="110.00" y="1035.00" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#5C6880" font-weight="400" text-anchor="start">Initial pool = case &lt; 90 in each job; parent_case = null also includes later random fallback, so it is not used here.</text><text x="110.00" y="1061.00" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#5C6880" font-weight="400" text-anchor="start">The map_source field is inherited from the parent even when a mutation changes the grid.</text></svg>