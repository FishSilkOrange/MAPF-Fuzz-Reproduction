<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>How far beyond the 25% MD threshold?</title><desc>Categorical counts by MD range for the 83 formal OF flags. 74 are between 25 and 30 percent. Two LaCAM outliers have MD 885.6 and 3205.6 percent.</desc><rect x="0.00" y="0.00" width="1920.00" height="1080.00" fill="#F6F8FB"/><rect x="70.00" y="55.00" width="1780.00" height="960.00" fill="#FFFFFF" rx="24"/><text x="110.00" y="145.00" font-family="Arial,Helvetica,sans-serif" font-size="56" fill="#17223B" font-weight="700" text-anchor="start">How far beyond the 25% MD threshold?</text><text x="110.00" y="197.00" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#5C6880" font-weight="400" text-anchor="start">83 OF-flagged groups among 94,005 groups with a numeric MD</text><rect x="1560.00" y="95.00" width="230.00" height="45.00" fill="#EAF0F8" rx="20"/><text x="1675.00" y="125.00" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#2D4F78" font-weight="700" text-anchor="middle">RQ1 · MAIN EXPERIMENT</text><rect x="290.00" y="246.00" width="27.00" height="27.00" fill="#3E78A7" rx="4"/><text x="330.00" y="269.00" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#17223B" font-weight="600" text-anchor="start">PIBT</text><rect x="655.00" y="246.00" width="27.00" height="27.00" fill="#D6A02D" rx="4"/><text x="695.00" y="269.00" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#17223B" font-weight="600" text-anchor="start">HCA</text><rect x="1020.00" y="246.00" width="27.00" height="27.00" fill="#48A58B" rx="4"/><text x="1060.00" y="269.00" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#17223B" font-weight="600" text-anchor="start">PIBT+</text><rect x="1385.00" y="246.00" width="27.00" height="27.00" fill="#A36AB4" rx="4"/><text x="1425.00" y="269.00" font-family="Arial,Helvetica,sans-serif" font-size="27" fill="#17223B" font-weight="600" text-anchor="start">LaCAM*</text><rect x="312.50" y="697.50" width="205.00" height="107.50" fill="#3E78A7"/><rect x="312.50" y="536.25" width="205.00" height="161.25" fill="#48A58B"/><rect x="312.50" y="407.25" width="205.00" height="129.00" fill="#A36AB4"/><text x="415.00" y="858.00" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#17223B" font-weight="600" text-anchor="middle">25–30%</text><text x="415.00" y="389.25" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#17223B" font-weight="700" text-anchor="middle">n = 74</text><rect x="667.50" y="778.12" width="205.00" height="26.88" fill="#A36AB4"/><text x="770.00" y="858.00" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#17223B" font-weight="600" text-anchor="middle">30–40%</text><text x="770.00" y="760.12" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#17223B" font-weight="700" text-anchor="middle">n = 5</text><rect x="1022.50" y="794.25" width="205.00" height="10.75" fill="#A36AB4"/><text x="1125.00" y="858.00" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#17223B" font-weight="600" text-anchor="middle">40–100%</text><text x="1125.00" y="776.25" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#17223B" font-weight="700" text-anchor="middle">n = 2</text><rect x="1377.50" y="794.25" width="205.00" height="10.75" fill="#A36AB4"/><text x="1480.00" y="858.00" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#17223B" font-weight="600" text-anchor="middle">≥100%</text><text x="1480.00" y="776.25" font-family="Arial,Helvetica,sans-serif" font-size="30" fill="#17223B" font-weight="700" text-anchor="middle">n = 2</text><line x1="260" y1="805.0" x2="1700" y2="805.0" stroke="#EBF0F5" stroke-width="1"/><text x="246.00" y="813.00" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5C6880" font-weight="400" text-anchor="end">0</text><line x1="260" y1="697.5" x2="1700" y2="697.5" stroke="#EBF0F5" stroke-width="1"/><text x="246.00" y="705.50" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5C6880" font-weight="400" text-anchor="end">20</text><line x1="260" y1="590.0" x2="1700" y2="590.0" stroke="#EBF0F5" stroke-width="1"/><text x="246.00" y="598.00" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5C6880" font-weight="400" text-anchor="end">40</text><line x1="260" y1="482.5" x2="1700" y2="482.5" stroke="#EBF0F5" stroke-width="1"/><text x="246.00" y="490.50" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5C6880" font-weight="400" text-anchor="end">60</text><line x1="260" y1="375.0" x2="1700" y2="375.0" stroke="#EBF0F5" stroke-width="1"/><text x="246.00" y="383.00" font-family="Arial,Helvetica,sans-serif" font-size="22" fill="#5C6880" font-weight="400" text-anchor="end">80</text><rect x="110.00" y="901.00" width="1700.00" height="85.00" fill="#EEF4F9" rx="8"/><text x="130.00" y="934.00" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#24445F" font-weight="600" text-anchor="start">74 of 83 OF flags are just above threshold (MD 25–30%); two LaCAM* cases reach 886% and 3,206%.</text><text x="130.00" y="968.00" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#24445F" font-weight="500" text-anchor="start">37 OF groups still exceed 25% using only original + order/flip MRs, without probe or obstacle SOC.</text><line x1="110" y1="1005" x2="1810" y2="1005" stroke="#D9E0EA" stroke-width="1"/><text x="110.00" y="1035.00" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#5C6880" font-weight="400" text-anchor="start">Bars count task groups in unequal MD bands; band width is categorical, not a density or linear MD axis.</text><text x="110.00" y="1061.00" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#5C6880" font-weight="400" text-anchor="start">MD uses paper/author scoring, including probe and obstacle; the strict order/flip-only check is shown for context.</text></svg>