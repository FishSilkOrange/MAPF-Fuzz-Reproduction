<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>RQ1: Flags per 1,000 task groups</title><desc>Pooled independent CF and OF flags per 1000 completed task groups, calculated from formal run summaries. These are descriptive flag rates, not proven defect probabilities.</desc><rect x="0.00" y="0.00" width="1920.00" height="1080.00" fill="#F6F8FB"/><rect x="70.00" y="55.00" width="1780.00" height="960.00" fill="#FFFFFF" rx="24"/><text x="110.00" y="145.00" font-family="Arial,Helvetica,sans-serif" font-size="56" fill="#17223B" font-weight="700" text-anchor="start">RQ1: Flags per 1,000 task groups</text><text x="110.00" y="197.00" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#5C6880" font-weight="400" text-anchor="start">Five runs pooled within each solver · adjusts for unequal task-group counts</text><rect x="1560.00" y="95.00" width="230.00" height="45.00" fill="#EAF0F8" rx="20"/><text x="1675.00" y="125.00" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#2D4F78" font-weight="700" text-anchor="middle">RQ1 · MAIN EXPERIMENT</text><rect x="305.00" y="246.00" width="28.00" height="28.00" fill="#3E78A7" rx="4"/><text x="346.00" y="271.00" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#17223B" font-weight="600" text-anchor="start">CF flags per 1,000 groups</text><rect x="1085.00" y="246.00" width="28.00" height="28.00" fill="#D96066" rx="4"/><text x="1126.00" y="271.00" font-family="Arial,Helvetica,sans-serif" font-size="31" fill="#17223B" font-weight="600" text-anchor="start">OF flags per 1,000 groups</text><text x="270.00" y="373.00" font-family="Arial,Helvetica,sans-serif" font-size="38" fill="#17223B" font-weight="700" text-anchor="end">PIBT</text><rect x="325.00" y="340.00" width="530.00" height="44.00" fill="#EAF0F6" rx="8"/><rect x="325.00" y="340.00" width="466.70" height="44.00" fill="#3E78A7" rx="8"/><text x="804.70" y="371.00" font-family="Arial,Helvetica,sans-serif" fo