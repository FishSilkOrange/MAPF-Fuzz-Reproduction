<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Which MRs are associated with findings?</title><desc>Formal RQ1 compact JSONL. CF associations are multi-label status mismatches with original; OF relation labels are the single most divergent MR recorded by the scoring implementation.</desc><rect x="0.00" y="0.00" width="1920.00" height="1080.00" fill="#F6F8FB"/><rect x="70.00" y="55.00" width="1780.00" height="960.00" fill="#FFFFFF" rx="24"/><text x="110.00" y="145.00" font-family="Arial,Helvetica,sans-serif" font-size="56" fill="#17223B" font-weight="700" text-anchor="start">Which MRs are associated with findings?</text><text x="110.00" y="197.00" font-family="Arial,Helvetica,sans-serif" font-size="28" fill="#5C6880" font-weight="400" text-anchor="start">CF: every status-mismatched relation · OF: one most-divergent relation per flagged group</text><rect x="1560.00" y="95.00" width="230.00" height="45.00" fill="#EAF0F8" rx="20"/><text x="1675.00" y="125.00" font-family="Arial,Helvetica,sans-serif" font-size="19" fill="#2D4F78" font-weight="700" text-anchor="middle">RQ1 · MAIN EXPERIMENT</text><rect x="340.00" y="247.00" width="25.00" height="25.00" fill="#3E78A7" rx="4"/><text x="378.00" y="269.00" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#17223B" font-weight="600" text-anchor="start">CF associations (346 groups)</text><rect x="1050.00" y="247.00" width="25.00" height="25.00" fill="#D96066" rx="4"/><text x="1088.00" y="269.00" font-family="Arial,Helvetica,sans-serif" font-size="29" fill="#17223B" font-weight="600" text-anchor="start">OF most-divergent (83 groups)</text><text x="310.00" y="364.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="600" text-anchor="end">Start-goal swap</text><rect x="340.00" y="336.00" width="530.00" height="38.00" fill="#EAF0F6" rx="5"/><rect x="340.00" y="336.00" width="530.00" height="38.00" fill="#3E78A7" rx="5"/><text x="882.00" y="365.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">215</text><rect x="1050.00" y="336.00" width="530.00" height="38.00" fill="#F7EEEE" rx="5"/><text x="1062.00" y="365.00" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#5C6880" font-weight="500" text-anchor="start">C1 only — not scored for OF</text><text x="310.00" y="438.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="600" text-anchor="end">Agent order</text><rect x="340.00" y="410.00" width="530.00" height="38.00" fill="#EAF0F6" rx="5"/><rect x="340.00" y="410.00" width="182.42" height="38.00" fill="#3E78A7" rx="5"/><text x="534.42" y="439.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">74</text><rect x="1050.00" y="410.00" width="530.00" height="38.00" fill="#F7EEEE" rx="5"/><rect x="1050.00" y="410.00" width="265.00" height="38.00" fill="#D96066" rx="5"/><text x="1327.00" y="439.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">10</text><text x="310.00" y="512.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="600" text-anchor="end">Left-right flip</text><rect x="340.00" y="484.00" width="530.00" height="38.00" fill="#EAF0F6" rx="5"/><rect x="340.00" y="484.00" width="157.77" height="38.00" fill="#3E78A7" rx="5"/><text x="509.77" y="513.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">64</text><rect x="1050.00" y="484.00" width="530.00" height="38.00" fill="#F7EEEE" rx="5"/><rect x="1050.00" y="484.00" width="530.00" height="38.00" fill="#D96066" rx="5"/><text x="1592.00" y="513.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">20</text><text x="310.00" y="586.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="600" text-anchor="end">Up-down flip</text><rect x="340.00" y="558.00" width="530.00" height="38.00" fill="#EAF0F6" rx="5"/><rect x="340.00" y="558.00" width="194.74" height="38.00" fill="#3E78A7" rx="5"/><text x="546.74" y="587.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">79</text><rect x="1050.00" y="558.00" width="530.00" height="38.00" fill="#F7EEEE" rx="5"/><rect x="1050.00" y="558.00" width="371.00" height="38.00" fill="#D96066" rx="5"/><text x="1433.00" y="587.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">14</text><text x="310.00" y="660.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="600" text-anchor="end">180° rotation</text><rect x="340.00" y="632.00" width="530.00" height="38.00" fill="#EAF0F6" rx="5"/><rect x="340.00" y="632.00" width="194.74" height="38.00" fill="#3E78A7" rx="5"/><text x="546.74" y="661.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">79</text><rect x="1050.00" y="632.00" width="530.00" height="38.00" fill="#F7EEEE" rx="5"/><rect x="1050.00" y="632.00" width="477.00" height="38.00" fill="#D96066" rx="5"/><text x="1539.00" y="661.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">18</text><text x="310.00" y="734.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="600" text-anchor="end">Added probe</text><rect x="320.00" y="698.00" width="1325.00" height="63.00" fill="#FBF7EC" rx="6"/><text x="310.00" y="734.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="600" text-anchor="end">Added probe</text><rect x="340.00" y="706.00" width="530.00" height="38.00" fill="#EAF0F6" rx="5"/><rect x="340.00" y="706.00" width="125.72" height="38.00" fill="#3E78A7" rx="5"/><text x="477.72" y="735.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">51</text><rect x="1050.00" y="706.00" width="530.00" height="38.00" fill="#F7EEEE" rx="5"/><rect x="1050.00" y="706.00" width="503.50" height="38.00" fill="#D96066" rx="5"/><text x="1565.50" y="735.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">19</text><text x="310.00" y="808.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="600" text-anchor="end">Added obstacle</text><rect x="320.00" y="772.00" width="1325.00" height="63.00" fill="#FBF7EC" rx="6"/><text x="310.00" y="808.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="600" text-anchor="end">Added obstacle</text><rect x="340.00" y="780.00" width="530.00" height="38.00" fill="#EAF0F6" rx="5"/><rect x="340.00" y="780.00" width="91.21" height="38.00" fill="#3E78A7" rx="5"/><text x="443.21" y="809.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">37</text><rect x="1050.00" y="780.00" width="530.00" height="38.00" fill="#F7EEEE" rx="5"/><rect x="1050.00" y="780.00" width="53.00" height="38.00" fill="#D96066" rx="5"/><text x="1115.00" y="809.00" font-family="Arial,Helvetica,sans-serif" font-size="25" fill="#17223B" font-weight="700" text-anchor="start">2</text><rect x="110.00" y="890.00" width="1700.00" height="94.00" fill="#EEF4F9" rx="8"/><text x="130.00" y="927.00" font-family="Arial,Helvetica,sans-serif" font-size="23" fill="#24445F" font-weight="600" text-anchor="start">Start-goal swap appears in 215 CF groups; order/flip relations are the most divergent in 62 of 83 OF groups.</text><text x="130.00" y="961.00" font-family="Arial,Helvetica,sans-serif" font-size="21" fill="#24445F" font-weight="500" text-anchor="start">Probe and obstacle rows are highlighted because raw SOC comparability is debatable for these transformations.</text><line x1="110" y1="1005" x2="1810" y2="1005" stroke="#D9E0EA" stroke-width="1"/><text x="110.00" y="1035.00" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#5C6880" font-weight="400" text-anchor="start">CF relation counts sum to 599 because one of the 346 groups can involve several MRs; they are not unique-case counts.</text><text x="110.00" y="1061.00" font-family="Arial,Helvetica,sans-serif" font-size="20" fill="#5C6880" font-weight="400" text-anchor="start">OF labels sum to 83; “most divergent” is a scoring label, not a causal proof. Start-goal swap checks C1 only.</text></svg>