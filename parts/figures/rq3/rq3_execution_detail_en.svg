<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080"><title>Inside execution: solver vs. parsing</title><desc>Main RQ3 run. Solver and parsing are execution subcomponents; the remainder includes input preparation and cleanup.</desc><rect x="0.00" y="0.00" width="1920.00" height="1080.00" fill="#F6F8FB" /><rect x="70.00" y="55.00" width="1780.00" height="960.00" fill="#FFFFFF" rx="24" /><text x="110.00" y="145.00" fill="#17223B" font-family="Arial,Helvetica,sans-serif" font-size="56" font-weight="700" text-anchor="start">Inside execution: solver vs. parsing</text><text x="110.00" y="197.00" fill="#5C6880" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="400" text-anchor="start">Execution only · denominator: execution-phase time of each solver</text><rect x="1560.00" y="95.00" width="230.00" height="45.00" fill="#EAF0F8" rx="20" /><text x="1675.00" y="125.00" fill="#2D4F78" font-family="Arial,Helvetica,sans-serif" font-size="23" font-weight="600" text-anchor="middle">RQ3 · MAIN EXPERIMENT</text><rect x="330.00" y="244.00" width="32.00" height="32.00" fill="#3777A8" rx="5" /><text x="374.00" y="270.00" fill="#17223B" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="500" text-anchor="start">Solver process</text><rect x="740.00" y="244.00" width="32.00" height="32.00" fill="#43A6A0" rx="5" /><text x="784.00" y="270.00" fill="#17223B" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="500" text-anchor="start">Parsing + validation</text><rect x="1230.00" y="244.00" width="32.00" height="32.00" fill="#B8C4D4" rx="5" /><text x="1274.00" y="270.00" fill="#17223B" font-family="Arial,Helvetica,sans-serif" font-size="28" font-weight="500" text-anchor="start">Input prep / other</text><text x="280.00" y="396.00" fill="#17223B" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" text-anchor="end">PIBT</text><rect x="310.00" y="348.00" width="533.23" height="72.00" fill="#3777A8" /><text x="576.61" y="395.00" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="middle">43.7%</text><rect x="843.23" y="348.00" width="679.44" height="72.00" fill="#43A6A0" /><text x="1182.95" y="395.00" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="middle">55.7%</text><rect x="1522.67" y="348.00" width="7.33" height="72.00" fill="#B8C4D4" /><text x="1565.00" y="395.00" fill="#5C6880" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" text-anchor="start">21.2 min</text><text x="280.00" y="538.00" fill="#17223B" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" text-anchor="end">HCA</text><rect x="310.00" y="490.00" width="685.25" height="72.00" fill="#3777A8" /><text x="652.62" y="537.00" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="middle">56.2%</text><rect x="995.25" y="490.00" width="529.70" height="72.00" fill="#43A6A0" /><text x="1260.10" y="537.00" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="middle">43.4%</text><rect x="1524.95" y="490.00" width="5.05" height="72.00" fill="#B8C4D4" /><text x="1565.00" y="537.00" fill="#5C6880" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" text-anchor="start">22.9 min</text><text x="280.00" y="680.00" fill="#17223B" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" text-anchor="end">PIBT+</text><rect x="310.00" y="632.00" width="539.91" height="72.00" fill="#3777A8" /><text x="579.95" y="679.00" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="middle">44.3%</text><rect x="849.91" y="632.00" width="672.87" height="72.00" fill="#43A6A0" /><text x="1186.34" y="679.00" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="middle">55.2%</text><rect x="1522.78" y="632.00" width="7.22" height="72.00" fill="#B8C4D4" /><text x="1565.00" y="679.00" fill="#5C6880" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" text-anchor="start">20.8 min</text><text x="280.00" y="822.00" fill="#17223B" font-family="Arial,Helvetica,sans-serif" font-size="39" font-weight="700" text-anchor="end">LaCAM*</text><rect x="310.00" y="774.00" width="1189.86" height="72.00" fill="#3777A8" /><text x="904.93" y="821.00" fill="#FFFFFF" font-family="Arial,Helvetica,sans-serif" font-size="29" font-weight="700" text-anchor="middle">97.5%</text><rect x="1499.86" y="774.00" width="29.90" height="72.00" fill="#43A6A0" /><rect x="1529.75" y="774.00" width="0.25" height="72.00" fill="#B8C4D4" /><text x="1565.00" y="821.00" fill="#5C6880" font-family="Arial,Helvetica,sans-serif" font-size="27" font-weight="500" text-anchor="start">55.7 min</text><line x1="310.0" y1="870" x2="310.0" y2="880" stroke="#D9E0EA" stroke-width="1" /><text x="310.00" y="920.00" fill="#5C6880" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="middle">0%</text><line x1="615.0" y1="870" x2="615.0" y2="880" stroke="#D9E0EA" stroke-width="1" /><text x="615.00" y="920.00" fill="#5C6880" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="middle">25%</text><line x1="920.0" y1="870" x2="920.0" y2="880" stroke="#D9E0EA" stroke-width="1" /><text x="920.00" y="920.00" fill="#5C6880" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="middle">50%</text><line x1="1225.0" y1="870" x2="1225.0" y2="880" stroke="#D9E0EA" stroke-width="1" /><text x="1225.00" y="920.00" fill="#5C6880" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="middle">75%</text><line x1="1530.0" y1="870" x2="1530.0" y2="880" stroke="#D9E0EA" stroke-width="1" /><text x="1530.00" y="920.00" fill="#5C6880" font-family="Arial,Helvetica,sans-serif" font-size="25" font-weight="400" text-anchor="middle">100%</text><line x1="310" y1="870" x2="1530" y2="870" stroke="#D9E0EA" stroke-width="2" /><rect x="110.00" y="947.00" width="1700.00" height="42.00" fill="#EEF4F9" rx="8" /><text x="130.00" y="976.00" fill="#24445F" font-family="Arial,Helvetica,sans-serif" font-size="24" font-weight="600" text-anchor="start">97.5% of LaCAM* execution is solver time; parsing and validation take 43–56% for the other solvers.</text><line x1="110" y1="1005" x2="1810" y2="1005" stroke="#D9E0EA" stroke-width="1" /><text x="110.00" y="1035.00" fill="#5C6880" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">Solver and result_parse are inside execution; do not add these subcomponents to the four phase totals.</text><text x="110.00" y="1061.00" fill="#5C6880" font-family="Arial,Helvetica,sans-serif" font-size="20" font-weight="400" text-anchor="start">One worker; parsing includes trajectory validation, so comparison with the paper execution phase is approximate.</text></svg>